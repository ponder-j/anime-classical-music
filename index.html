* { box-sizing: border-box; }

body { margin: 0; }
button {

.viewer {

}
.hotspot:hover .media-icon, .hotspot:focus-visible .media-icon { opacity: 1; }
.deck-footer {
  display: flex;

  gap: 10px;

.tool {

.tool:hover:not(:disabled) { border-color: var(--accent); }
.count { min-width: 62px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.viewer:fullscreen { display: block; }
.viewer:fullscreen .deck { height: 100%; }
.viewer:fullscreen .slide { width: min(100vw, calc(100vh * 16 / 9)); }
.viewer:fullscreen .deck-footer {
  position: absolute;
  right: 0;
  bottom: 0;
  z-index: 2;
  min-height: var(--toolbar-height);
  border: 1px solid var(--border);
  border-radius: 7px 0 0 0;
  opacity: 0;
}
.viewer:fullscreen .deck-footer:hover,
.viewer:fullscreen .deck-footer:focus-within { opacity: 1; }
.player {
  position: fixed;

  flex-direction: column;
  background: var(--media-bg);
}
.player-header {

  padding: 9px 15px;

}
.player video { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.player-error { margin: auto; padding: 16px; color: var(--ink); }

.melody-error { position: fixed; top: 16px; left: 16px; z-index: 1; margin: 0; padding: 8px 10px; background: var(--control-bg); }
@media (max-width: 440px) {

<script>
"use strict";
const element = id => document.getElementById(id);
const viewer = element("viewer");
const deck = element("deck");
const slides = Array.from(deck.querySelectorAll(".slide"));
const nav = viewer.querySelector("nav");
const player = element("player");
const movie = element("movie");
const melody = element("melody");
const closePlayer = element("close-player");
const melodyError = element("melody-error");
const videoError = element("video-error");
let page = 0;
let playingVideo = null;
let playingMelody = null;
function showPage(index) {
  const bounded = Math.min(slides.length - 1, Math.max(0, index));
  if (bounded !== page) {
    stopMelody();
    slides[page].hidden = true;
    slides[bounded].hidden = false;
    page = bounded;
    if (page + 1 < slides.length) {
      const image = new Image();
      image.src = slides[page + 1].querySelector("img").src;
    }
  }
  element("count").textContent = (page + 1) + " / " + slides.length;
  element("prev").disabled = page === 0;
  element("next").disabled = page === slides.length - 1;
}

function stopMelody() {
  melody.hidden = true;
  melody.pause();
  melody.removeAttribute("src");
  melody.load();
  if (playingMelody) {
    playingMelody.removeAttribute("aria-pressed");
    playingMelody = null;
  }
  melodyError.hidden = true;
}

function showMelodyError() {
  if (!playingMelody) return;
  const label = playingMelody.getAttribute("aria-label");
  stopMelody();
  melodyError.textContent = `无法播放「${label}」。请检查 assets 文件夹。`;
  melodyError.hidden = false;
}

function playMelody(button) {
  const shouldStop = playingMelody === button;
  stopMelody();
  if (shouldStop) return;
  playingMelody = button;
  button.setAttribute("aria-pressed", "true");
  melody.style.top = button.dataset.rowTop;
  melody.src = button.dataset.melody;
  melody.play().then(() => {
    if (playingMelody === button) melody.hidden = false;
  }).catch(error => {
    if (playingMelody === button && error.name !== "AbortError") showMelodyError();
  });
}

function setFullscreen() {
  if (document.fullscreenElement) return document.exitFullscreen().catch(() => {});
  if (viewer.requestFullscreen) return viewer.requestFullscreen().catch(() => {});
}

function openVideo(button) {
  stopMelody();
  playingVideo = button;
  videoError.hidden = true;
  movie.hidden = false;
  element("playing-title").textContent = button.dataset.label;
  element("direct-file").href = button.dataset.video;
  player.hidden = false;
  deck.inert = true;
  nav.inert = true;
  if (!document.fullscreenElement && viewer.requestFullscreen) setFullscreen();
  movie.src = button.dataset.video;
  closePlayer.focus();
  movie.play().catch(() => {
    if (playingVideo === button && movie.error) showVideoError();
  });
}

function showVideoError() {
  if (!playingVideo) return;
  movie.hidden = true;
  videoError.hidden = false;
}

function returnToSlide() {
  const button = playingVideo;
  playingVideo = null;
  movie.pause();
  movie.removeAttribute("src");
  movie.load();
  player.hidden = true;
  deck.inert = false;
  nav.inert = false;
  if (button) button.focus({ preventScroll: true });
}

deck.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button || playingVideo) return;
  if (button.dataset.video) openVideo(button);
  else if (button.dataset.melody) playMelody(button);
  else if (button.dataset.page) showPage(Number(button.dataset.page) - 1);
});

element("home").addEventListener("click", () => showPage(0));
element("prev").addEventListener("click", () => showPage(page - 1));
element("next").addEventListener("click", () => showPage(page + 1));
element("full").addEventListener("click", setFullscreen);
closePlayer.addEventListener("click", returnToSlide);
movie.addEventListener("ended", returnToSlide);
movie.addEventListener("error", showVideoError);
melody.addEventListener("ended", stopMelody);
melody.addEventListener("error", showMelodyError);
document.addEventListener("fullscreenchange", () => {
  element("full").textContent = document.fullscreenElement ? "退出全屏" : "全屏";
});

document.addEventListener("keydown", event => {
  if (event.altKey || event.ctrlKey || event.metaKey || event.defaultPrevented) return;
  if (playingVideo) {
    if (event.code === "Escape") {
      event.preventDefault();
      returnToSlide();
    } else if (event.code === "Space" && event.target !== movie) {
      event.preventDefault();
      if (movie.paused) movie.play().catch(() => {});
      else movie.pause();
    } else if (["ArrowLeft", "ArrowRight", "PageDown", "PageUp"].includes(event.key) && event.target !== movie) {
      event.preventDefault();
    }
    return;
  }
  const changes = { ArrowLeft: -1, PageUp: -1, ArrowRight: 1, PageDown: 1 };
  if (Object.prototype.hasOwnProperty.call(changes, event.key)) {
    event.preventDefault();
    showPage(page + changes[event.key]);
  } else if (event.key === "Home" || event.key === "End") {
    event.preventDefault();
    showPage(event.key === "Home" ? 0 : slides.length - 1);
  } else if (event.key.toLowerCase() === "f" && !event.repeat) {
    event.preventDefault();
    setFullscreen();
  }
});

showPage(0);
</script>
</body>
